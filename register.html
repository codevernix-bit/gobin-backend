<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create BinMail Account</title>

  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- FONT -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#f5f7fb;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{

      width:100%;
      max-width:420px;

      background:white;

      border-radius:24px;

      padding:40px 34px;

      box-shadow:
      0 10px 40px rgba(0,0,0,0.08);

    }

    /* LOGO */

    .logo{
      font-size:46px;
      font-weight:600;
      letter-spacing:-3px;
      text-align:center;
      margin-bottom:12px;
      user-select:none;
    }

    .g{ color:#4285F4; }
    .o{ color:#EA4335; }
    .b{ color:#34A853; }
    .i{ color:#FBBC05; }
    .n{ color:#7E57FF; }

    /* TITLE */

    .title{
      text-align:center;
      font-size:26px;
      font-weight:600;
      color:#202124;
      margin-bottom:8px;
    }

    .subtitle{
      text-align:center;
      color:#5f6368;
      font-size:14px;
      margin-bottom:28px;
      line-height:1.5;
    }

    /* FORM */

    .input-group{
      margin-bottom:18px;
    }

    .input-group input{

      width:100%;

      padding:15px 16px;

      border:1px solid #dadce0;

      border-radius:12px;

      font-size:15px;

      outline:none;

      transition:0.2s ease;

    }

    .input-group input:focus{

      border-color:#4285F4;

      box-shadow:
      0 0 0 4px rgba(66,133,244,0.15);

    }

    /* EMAIL PREVIEW */

    .email-preview{

      background:#f3f7ff;

      border:1px solid #d8e5ff;

      color:#1574ff;

      padding:14px 16px;

      border-radius:12px;

      font-size:14px;

      margin-bottom:18px;

      text-align:center;

      font-weight:500;

    }

    /* BUTTON */

    .btn{

      width:100%;

      border:none;

      background:#4285F4;

      color:white;

      padding:15px;

      border-radius:12px;

      font-size:15px;

      font-weight:500;

      cursor:pointer;

      transition:0.2s ease;

    }

    .btn:hover{
      opacity:0.92;
    }

    /* LOGIN LINK */

    .login-link{

      margin-top:20px;

      text-align:center;

      font-size:14px;

      color:#5f6368;

    }

    .login-link a{

      color:#4285F4;

      text-decoration:none;

      font-weight:500;

    }

    /* FOOTER */

    .footer{

      margin-top:24px;

      text-align:center;

      font-size:13px;

      color:#5f6368;

    }

  </style>

</head>

<body>

  <div class="card">

    <!-- LOGO -->

    <div class="logo">

      <span class="g">b</span>
      <span class="o">i</span>
      <span class="b">n</span>
      <span class="i">m</span>
      <span class="n">ail</span>

    </div>

    <!-- TITLE -->

    <div class="title">
      Create your BinMail
    </div>

    <div class="subtitle" style="font-size:15px">

  Secure email powered by

  <a
    href="https://gobin.id/"
    target="_blank"

    style="
      background:linear-gradient(90deg,#4285F4,#EA4335);
      background-clip:text;
      -webkit-background-clip:text;
      color:transparent;
      -webkit-text-fill-color:transparent;
      text-decoration:none;
      font-weight:700;
      font-size:17px;
      letter-spacing:0.4px;
    "
  >
    GoBin
  </a>

</div>

    <!-- FORM -->

    <form id="registerForm">

      <div class="input-group">

        <input
          type="text"
          id="username"
          placeholder="Choose username"
          autocomplete="off"
        >

      </div>

      <!-- EMAIL PREVIEW -->

      <div
        class="email-preview"
        id="emailPreview"
      >
        yourname@gobin.id
      </div>

      <div class="input-group">

        <input
          type="password"
          id="password"
          placeholder="Create password"
        >

      </div>

      <button
        type="submit"
        class="btn"
      >
        Create Account
      </button>

    </form>

    <!-- LOGIN -->

    <div class="login-link">

      Already have account?
      <a href="mail">
        Sign In
      </a>

    </div>

    <!-- FOOTER -->

    <div class="footer">
      © 2026 BinMail
    </div>

  </div>

  <!-- SCRIPT -->

  <script>

    const usernameInput =
    document.getElementById("username")

    const emailPreview =
    document.getElementById("emailPreview")

    usernameInput.addEventListener("input",()=>{

      const username =
      usernameInput.value.trim()

      if(username){

        emailPreview.innerHTML =
        `${username}@gobin.id`

      }else{

        emailPreview.innerHTML =
        `yourname@gobin.id`

      }

    })

    /* REGISTER */

    const form =
    document.getElementById("registerForm")

    form.addEventListener("submit", async(e)=>{

      e.preventDefault()

      const username =
      document.getElementById("username").value

      const password =
      document.getElementById("password").value

      try{

        const res =
        await fetch("https://gobin-backend-production.up.railway.app/api/register",{

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            username,
            password
          })

        })

        const data =
        await res.json()

        alert(data.message)

        if(data.success){

          alert(
            `Email kamu: ${data.user.email}`
          )

          window.location.href =
          "/mail"

        }

      }catch(err){

        console.log(err)

        alert("Server error")

      }

    })

  </script>

</body>
</html>
