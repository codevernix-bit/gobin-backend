<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BinMail Inbox</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
    body{background:#f5f7fb;height:100vh;overflow:hidden;display:flex}
    .sidebar{width:260px;background:white;border-right:1px solid #e5e7eb;padding:22px 18px;display:flex;flex-direction:column}
    .logo{font-size:36px;font-weight:600;letter-spacing:-2px;margin-bottom:28px;user-select:none}
    .g{color:#4285F4}.o{color:#EA4335}.b{color:#34A853}.i{color:#FBBC05}.n{color:#7E57FF}
    .compose-btn{background:#4285F4;color:white;border:none;padding:14px;border-radius:14px;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:28px;transition:.2s ease;box-shadow:0 8px 18px rgba(66,133,244,.18)}
    .compose-btn:hover{opacity:.92}
    .menu{display:flex;flex-direction:column;gap:8px}
    .menu a{text-decoration:none;color:#374151;padding:13px 16px;border-radius:12px;font-size:15px;transition:.2s ease;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .menu a:hover{background:#f3f7ff;color:#4285F4}
    .menu .active{background:#e8f0fe;color:#4285F4;font-weight:500}
    .unread-badge{background:#ef4444;color:white;font-size:11px;padding:2px 7px;border-radius:999px;display:none}
    .profile{margin-top:auto;padding-top:18px;border-top:1px solid #e5e7eb}
    .profile-name{font-size:15px;font-weight:600;color:#202124}
    .profile-email{font-size:13px;color:#5f6368;margin-top:3px}
    .main{flex:1;display:flex;flex-direction:column}
    .topbar{height:74px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 24px;gap:18px}
    .search-box{flex:1;background:#f3f4f6;border-radius:14px;padding:12px 16px;display:flex;align-items:center}
    .search-box input{border:none;background:transparent;outline:none;width:100%;font-size:14px;margin-left:10px}
    .title-badge{font-size:15px;color:#4285F4;font-weight:600;white-space:nowrap}
    .mail-container{flex:1;overflow-y:auto;padding:20px}
    .mail-item{background:white;border-radius:18px;padding:18px 20px;margin-bottom:14px;transition:.2s ease;cursor:pointer;border:1px solid transparent}
    .mail-item:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.06);border-color:#dbeafe}
    .mail-item.unread{background:#eef4ff;border-color:#bfdbfe}
    .mail-item.unread .mail-name,.mail-item.unread .mail-subject{font-weight:700;color:#111827}
    .mail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px}
    .mail-name{font-size:15px;font-weight:600;color:#202124;word-break:break-word}
    .mail-time{font-size:12px;color:#6b7280;white-space:nowrap}
    .mail-subject{font-size:14px;font-weight:500;color:#374151;margin-bottom:6px}
    .mail-preview{font-size:13px;color:#6b7280;line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .empty{background:white;border-radius:18px;padding:28px;text-align:center;color:#6b7280}
    .loading{background:white;border-radius:18px;padding:28px;text-align:center;color:#4285F4}
    .detail-actions{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
    .back-btn,.reply-btn{border:none;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}
    .back-btn{background:#e5e7eb;color:#111827}
    .reply-btn{background:#4285F4;color:white}
    .compose-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;justify-content:center;align-items:center;z-index:9999;padding:16px}
    .compose-box{width:100%;max-width:520px;background:white;border-radius:20px;padding:24px}
    .compose-title{font-size:22px;font-weight:600;margin-bottom:20px}
    .compose-box input,.compose-box textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:14px;font-size:14px;outline:none}
    .compose-box textarea{height:180px;resize:none}
    .compose-actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
    .close-btn,.send-btn,.draft-btn{border:none;padding:12px 20px;border-radius:12px;cursor:pointer;font-weight:600}
    .close-btn{background:#e5e7eb}
    .draft-btn{background:#f59e0b;color:white}
    .send-btn{background:#4285F4;color:white}

    @media(max-width:768px){
  body{
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:#f5f7fb;
  }

  .sidebar{
  width:100%;
  height:auto;
  padding:6px 12px 8px;
  border-right:none;
  border-bottom:1px solid #e5e7eb;
  flex-direction:column;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:26px;
  margin-bottom:6px;
  line-height:1;
}

  .compose-btn{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:12px;
  }

  .menu{
    flex-direction:row;
    overflow-x:auto;
    gap:8px;
    padding-bottom:4px;
    scrollbar-width:none;
  }

  .menu::-webkit-scrollbar{
    display:none;
  }

  .menu a{
    min-width:max-content;
    padding:10px 13px;
    font-size:13px;
    border-radius:999px;
    flex:none;
  }

  .profile{
    margin-top:10px;
    padding-top:10px;
  }

  .profile-name{
    font-size:13px;
  }

  .profile-email{
    font-size:11px;
  }

  .main{
    flex:1;
    width:100%;
    min-height:0;
  }

  .topbar{
    height:auto;
    padding:10px 12px;
    gap:10px;
    flex-direction:column;
    align-items:stretch;
  }

  .title-badge{
    font-size:14px;
  }

  .search-box{
    width:100%;
    padding:10px 12px;
    border-radius:12px;
  }

  .mail-container{
    flex:1;
    overflow-y:auto;
    padding:12px;
  }

  .mail-item{
    padding:14px;
    border-radius:15px;
    margin-bottom:10px;
  }

  .mail-top{
    align-items:flex-start;
  }

  .mail-name{
    font-size:14px;
  }

  .mail-time{
    font-size:11px;
  }

  .mail-subject{
    font-size:14px;
  }

  .mail-preview{
    font-size:13px;
    max-height:150px;
    overflow:hidden;
  }

  .compose-modal{
    align-items:flex-end;
    padding:0;
  }

  .compose-box{
    width:100%;
    max-width:none;
    border-radius:22px 22px 0 0;
    padding:18px;
    max-height:90dvh;
    overflow-y:auto;
  }

  .compose-title{
    font-size:20px;
    margin-bottom:14px;
  }

  .compose-box input,
  .compose-box textarea{
    padding:13px;
    font-size:14px;
    border-radius:12px;
  }

  .compose-box textarea{
    height:150px;
  }

  .compose-actions{
    position:sticky;
    bottom:0;
    background:white;
    padding-top:10px;
  }

  .close-btn,
  .send-btn,
  .draft-btn{
    flex:1;
    padding:12px;
  }
}
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo">
      <span class="g">b</span><span class="o">i</span><span class="b">n</span><span class="i">m</span><span class="n">ail</span>
    </div>

    <button class="compose-btn" onclick="openCompose()">✉️ Compose</button>

    <div class="menu">
      <a data-folder="inbox" class="active">
        <span>📥 Inbox</span>
        <span id="unreadBadge" class="unread-badge">0</span>
      </a>
      <a data-folder="sent"><span>📤 Sent</span></a>
      <a data-folder="drafts"><span>📝 Draft</span></a>
      <a data-folder="starred"><span>⭐ Starred</span></a>
      <a data-folder="trash"><span>🗑 Trash</span></a>
    </div>

    <div class="profile">
      <div class="profile-name">User BinMail</div>
      <div class="profile-email">user@gobin.id</div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="title-badge" id="folderTitle">Inbox</div>
      <div class="search-box">
        🔍
        <input type="text" id="searchInput" placeholder="Search mail...">
      </div>
    </div>

    <div class="mail-container" id="mailContainer"></div>
  </div>

  <div class="compose-modal" id="composeModal">
    <div class="compose-box">
      <div class="compose-title" id="composeTitle">New Message</div>

      <input type="email" id="to" placeholder="To: contoh@gobin.id">
      <input type="text" id="subject" placeholder="Subject">
      <textarea id="message" placeholder="Write message..."></textarea>
      <input type="file" id="attachments" multiple>

      <div class="compose-actions">
        <button class="close-btn" onclick="closeCompose()">Cancel</button>
        <button class="draft-btn" onclick="saveDraft()">Save Draft</button>
        <button class="send-btn" onclick="sendEmail()">Send</button>
      </div>
    </div>
  </div>

<script>
const API = "https://gobin-backend-production.up.railway.app"

const user = JSON.parse(localStorage.getItem("binmailUser"))

let currentFolder = "inbox"
let currentEmails = []
let currentShownEmails = []
let unreadCount = 0

if(!user){
  window.location.href = "/mail"
}

document.querySelector(".profile-name").innerText = user.username || "User BinMail"
document.querySelector(".profile-email").innerText = user.email || "user@gobin.id"

const logoutBtn = document.createElement("button")
logoutBtn.innerText = "Logout"
logoutBtn.style.marginTop = "14px"
logoutBtn.style.width = "100%"
logoutBtn.style.padding = "12px"
logoutBtn.style.border = "none"
logoutBtn.style.borderRadius = "12px"
logoutBtn.style.background = "#ef4444"
logoutBtn.style.color = "white"
logoutBtn.style.cursor = "pointer"

logoutBtn.onclick = () => {
  localStorage.removeItem("binmailUser")
  window.location.href = "/mail"
}

document.querySelector(".profile").appendChild(logoutBtn)

document.querySelectorAll(".menu a").forEach(link => {
  link.addEventListener("click", (e) => {
    e.preventDefault()
    const folder = link.dataset.folder
    setActiveMenu(folder)
    loadMail(folder)
  })
})

document.getElementById("searchInput").addEventListener("input", function(){
  renderEmails(currentEmails, this.value)
})

function setActiveMenu(folder){
  document.querySelectorAll(".menu a").forEach(a => a.classList.remove("active"))

  const activeLink = document.querySelector(`.menu a[data-folder="${folder}"]`)

  if(activeLink){
    activeLink.classList.add("active")
  }

  const labels = {
    inbox:"Inbox",
    sent:"Sent",
    drafts:"Draft",
    starred:"Starred",
    trash:"Trash"
  }

  document.getElementById("folderTitle").innerText = labels[folder] || "Inbox"
  currentFolder = folder
}

async function loadMail(folder = "inbox"){
  const box = document.getElementById("mailContainer")

  box.innerHTML = `<div class="loading">Loading ${folder}...</div>`

  try{
    const res = await fetch(`${API}/api/${folder}/${encodeURIComponent(user.email)}`)
    const data = await res.json()

    if(!data.success){
      box.innerHTML = `<div class="empty">${data.message || "Gagal load email"}</div>`
      return
    }

    currentEmails = data.emails || []
    currentShownEmails = currentEmails

    renderEmails(currentEmails)
    loadUnread()

  }catch(err){
    console.log(err)

    box.innerHTML = `
      <div class="empty">
        Server error / API belum update.<br>
        Cek deploy backend Railway.
      </div>
    `
  }
}

function renderEmails(emails, keyword = ""){
  const box = document.getElementById("mailContainer")
  const q = keyword.trim().toLowerCase()

  const filtered = emails.filter(mail => {
    const text = `${mail.from} ${mail.to} ${mail.subject} ${mail.message}`.toLowerCase()
    return text.includes(q)
  })

  currentShownEmails = filtered

  if(filtered.length === 0){
    box.innerHTML = `<div class="empty">Belum ada email di folder ini.</div>`
    return
  }

  box.innerHTML = filtered.map((mail,index) => {
    const name = currentFolder === "inbox" ? mail.from : mail.to
    const time = formatTime(mail.createdAt)
    const subject = escapeHtml(mail.subject || "No Subject")
    const message = escapeHtml(mail.message || "")
    const target = escapeHtml(name || "-")
    const unreadClass = (!mail.read && currentFolder === "inbox") ? "unread" : ""
    const unreadDot = (!mail.read && currentFolder === "inbox") ? " 🔴" : ""

    return `
      <div class="mail-item ${unreadClass}" onclick="openEmail(${index})">
        <div class="mail-top">
          <div class="mail-name">${target}${unreadDot}</div>
          <div class="mail-time">${time}</div>
        </div>
        <div class="mail-subject">${subject}</div>
        <div class="mail-preview">${message || "(No message)"}</div>
      </div>
    `
  }).join("")
}

async function openEmail(index){
  const mail = currentShownEmails[index]
  const box = document.getElementById("mailContainer")

  if(!mail){
    return
  }

  if(currentFolder === "inbox" && !mail.read && mail._id){
    try{
      await fetch(`${API}/api/read/${mail._id}`, {
        method:"PATCH"
      })

      mail.read = true

      const originalMail = currentEmails.find(item => item._id === mail._id)
      if(originalMail){
        originalMail.read = true
      }

      loadUnread()

    }catch(err){
      console.log(err)
    }
  }

  const canReply = currentFolder !== "drafts"

  box.innerHTML = `
    <div class="mail-item" style="cursor:default">

      <div class="detail-actions">
        <button class="back-btn" onclick="renderEmails(currentEmails, document.getElementById('searchInput').value)">
          ← Back
        </button>

        ${
          canReply
          ? `<button class="reply-btn" onclick="replyEmail('${escapeJs(mail.from)}','${escapeJs(mail.subject || "No Subject")}')">
              ↩ Reply
            </button>`
          : `<button class="reply-btn" onclick="openDraft('${escapeJs(mail.to)}','${escapeJs(mail.subject || "")}','${escapeJs(mail.message || "")}')">
              ✏️ Edit Draft
            </button>`
        }
      </div>

      <div class="mail-top">
        <div class="mail-name">From: ${escapeHtml(mail.from)}</div>
        <div class="mail-time">${formatTime(mail.createdAt)}</div>
      </div>

      <div style="font-size:13px;color:#6b7280;margin-top:8px;word-break:break-word">
        To: ${escapeHtml(mail.to || "-")}
      </div>

      <div class="mail-subject" style="font-size:22px;margin-top:18px">
        ${escapeHtml(mail.subject || "No Subject")}
      </div>

      <div class="mail-preview" style="margin-top:20px;font-size:15px;line-height:1.8;color:#374151;white-space:pre-wrap">
        ${escapeHtml(mail.message || "(No message)")}
      </div>

    </div>
  `
}

function replyEmail(to, subject){
  openCompose()

  document.getElementById("composeTitle").innerText = "Reply Message"
  document.getElementById("to").value = to

  if(String(subject).startsWith("Re:")){
    document.getElementById("subject").value = subject
  }else{
    document.getElementById("subject").value = "Re: " + subject
  }

  document.getElementById("message").value = ""
  document.getElementById("message").focus()
}

function openDraft(to, subject, message){
  openCompose()

  document.getElementById("composeTitle").innerText = "Edit Draft"
  document.getElementById("to").value = to
  document.getElementById("subject").value = subject
  document.getElementById("message").value = message
  document.getElementById("message").focus()
}

async function loadUnread(){
  try{
    const res = await fetch(`${API}/api/unread/${encodeURIComponent(user.email)}`)
    const data = await res.json()

    if(data.success){
      unreadCount = data.unread || 0

      const badge = document.getElementById("unreadBadge")

      if(unreadCount > 0){
        badge.style.display = "inline-block"
        badge.innerText = unreadCount
      }else{
        badge.style.display = "none"
      }
    }

  }catch(err){
    console.log(err)
  }
}

function formatTime(value){
  if(!value) return ""

  const date = new Date(value)

  return date.toLocaleString("id-ID", {
    day:"2-digit",
    month:"short",
    hour:"2-digit",
    minute:"2-digit"
  })
}

function escapeHtml(text){
  return String(text || "").replace(/[&<>'"]/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "'":"&#39;",
    '"':"&quot;"
  }[c]))
}

function escapeJs(text){
  return String(text || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"")
}

function openCompose(){
  document.getElementById("composeTitle").innerText = "New Message"
  document.getElementById("composeModal").style.display = "flex"
}

function closeCompose(){
  document.getElementById("composeModal").style.display = "none"
}

function clearCompose(){
  document.getElementById("to").value = ""
  document.getElementById("subject").value = ""
  document.getElementById("message").value = ""
  document.getElementById("attachments").value = ""
  document.getElementById("composeTitle").innerText = "New Message"
}

async function sendEmail(){
  const to = document.getElementById("to").value.trim().toLowerCase()
  const subject = document.getElementById("subject").value.trim()
  const message = document.getElementById("message").value.trim()

  if(!to){
    alert("Email tujuan wajib diisi")
    return
  }

  try{
    const formData = new FormData()

formData.append("from", user.email)
formData.append("to", to)
formData.append("subject", subject)
formData.append("message", message)

const files = document.getElementById("attachments").files

for(let i = 0; i < files.length; i++){
  formData.append("attachments", files[i])
}

const res = await fetch(`${API}/api/send`, {
  method:"POST",
  body:formData
})

    const data = await res.json()

    alert(data.message)

    if(data.success){
      closeCompose()
      clearCompose()
      setActiveMenu("sent")
      loadMail("sent")
    }

  }catch(err){
    console.log(err)
    alert("Server error")
  }
}

async function saveDraft(){
  const to = document.getElementById("to").value.trim().toLowerCase()
  const subject = document.getElementById("subject").value.trim()
  const message = document.getElementById("message").value.trim()

  try{
    const res = await fetch(`${API}/api/drafts`, {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        from:user.email,
        to,
        subject,
        message
      })
    })

    const data = await res.json()

    alert(data.message)

    if(data.success){
      closeCompose()
      clearCompose()
      setActiveMenu("drafts")
      loadMail("drafts")
    }

  }catch(err){
    console.log(err)
    alert("Server error")
  }
}

loadMail("inbox")
loadUnread()
</script>

</body>
</html>
